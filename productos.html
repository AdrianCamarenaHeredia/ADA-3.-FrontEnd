<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFácil - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex">
    <div class="sidebar col-md-2 p-0">
        <h4 class="text-center py-4 border-bottom border-secondary"><i class="fas fa-boxes"></i> StockFácil</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="productos.html" class="active"><i class="fas fa-box me-2"></i> Productos</a>
        <a href="movimientos.html"><i class="fas fa-exchange-alt me-2"></i> Movimientos</a>
        <a href="index.html" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a>
    </div>

    <div class="content col-md-10 bg-light">
        <h2 class="mb-4 pb-2 border-bottom">Gestión de Productos</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">Registrar Nuevo Producto</div>
                    <div class="card-body">
                        <form id="productForm" class="needs-validation" novalidate>
                            <div class="mb-2">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Categoría</label>
                                <select class="form-select">
                                    <option value="">Seleccione...</option>
                                    <option>Papelería</option>
                                    <option>Abarrotes</option>
                                    <option>Farmacia</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Precio Compra</label>
                                <input type="number" step="0.01" class="form-control">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Precio Venta</label>
                                <input type="number" step="0.01" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Stock Inicial</label>
                                <input type="number" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">Lista de Productos</div>
                    <div class="card-body">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>P. Venta</th>
                                    <th>Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>001</td>
                                    <td>Cuaderno 100 hojas</td>
                                    <td>Papelería</td>
                                    <td>$25.00</td>
                                    <td>5</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>002</td>
                                    <td>Lápiz Mirado #2</td>
                                    <td>Papelería</td>
                                    <td>$8.00</td>
                                    <td>12</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
