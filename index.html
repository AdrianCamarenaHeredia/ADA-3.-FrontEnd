<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFácil - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <div class="card login-card shadow-lg border-0">
        <div class="card-body p-5">
            <h2 class="text-center text-primary mb-4"><i class="fas fa-boxes"></i> StockFácil</h2>
            <h5 class="text-center text-muted mb-4">Iniciar Sesión</h5>
            
            <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required minlength="6">
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Ingresar</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Usuario: admin@stockfacil.com | Pass: 123456</small>
            </div>
        </div>
    </div>
</body>
</html>
