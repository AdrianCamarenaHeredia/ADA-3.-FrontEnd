<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFácil - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex">
    <div class="sidebar col-md-2 p-0">
        <h4 class="text-center py-4 border-bottom border-secondary"><i class="fas fa-boxes"></i> StockFácil</h4>
        <a href="dashboard.html" class="active"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="productos.html"><i class="fas fa-box me-2"></i> Productos</a>
        <a href="movimientos.html"><i class="fas fa-exchange-alt me-2"></i> Movimientos</a>
        <a href="index.html" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a>
    </div>

    <div class="content col-md-10 bg-light">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2>Panel de Control</h2>
            <div class="text-muted fw-bold">
                <i class="far fa-calendar-alt me-2"></i> Hoy es:
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-danger text-white">
                        <i class="fas fa-exclamation-triangle me-2"></i> Alertas de Stock Bajo
                    </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Stock Actual</th>
                                    <th>Stock Mínimo</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Cuaderno Profesional</td>
                                    <td class="text-danger fw-bold">5</td>
                                    <td>10</td>
                                    <td><a href="movimientos.html" class="btn btn-sm btn-outline-primary">Surtir</a></td>
                                </tr>
                                <tr>
                                    <td>Lápiz del #2</td>
                                    <td class="text-danger fw-bold">12</td>
                                    <td>20</td>
                                    <td><a href="movimientos.html" class="btn btn-sm btn-outline-primary">Surtir</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm border-0 calculator">
                    <div class="card-header bg-dark text-white text-center">Calculadora Rápida</div>
                    <div class="card-body">
                        <input type="text" id="calcDisplay" class="form-control mb-2 text-end fw-bold fs-4" readonly value="0">
                        <div class="row g-2">
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcClear()">C</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('/')">/</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('*')">*</button></div>
                            <div class="col-3"><button class="btn btn-warning w-100" onclick="calcInput('-')">-</button></div>
                            
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('7')">7</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('8')">8</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('9')">9</button></div>
                            <div class="col-3"><button class="btn btn-warning w-100" onclick="calcInput('+')">+</button></div>
                            
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('4')">4</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('5')">5</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('6')">6</button></div>
                            <div class="col-3 row-span-2"><button class="btn btn-success w-100 h-100" onclick="calcCalculate()">=</button></div>
                            
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('1')">1</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('2')">2</button></div>
                            <div class="col-3"><button class="btn btn-light w-100" onclick="calcInput('3')">3</button></div>
                            
                            <div class="col-9"><button class="btn btn-light w-100" onclick="calcInput('0')">0</button></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
